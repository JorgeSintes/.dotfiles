# Application bindings
# bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

# bindd = SUPER, return, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, return, Terminal, exec, $terminal tmux
# bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, E, Terminal, exec, $terminal tmux new-session -A -s main "zsh -ic 'y; exec zsh -l'"
bindd = SUPER SHIFT, W, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, I, Nmtui, exec, $terminal --app-id=Nmtui -e nmtui
# bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
# bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, C, Editor, exec,$terminal --app-id=VscodeOpen -e open-vscode
bindd = SUPER SHIFT, C, Editor, exec,$terminal --app-id=VscodeOpen -e open-vscode-remote
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
# bindd = SUPER, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER, slash, Passwords, exec, uwsm app -- bitwarden-desktop

bindr = SUPER, N, exec, toggle-kb

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
# bindd = SUPER SHIFT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, M, Calendar, exec, omarchy-launch-webapp "https://calendar.google.com/calendar/u/0/r"
bindd = SUPER, M, Email, exec, omarchy-launch-or-focus thunderbird "uwsm app -- thunderbird"
# bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER SHIFT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
# bindd = SUPER ALT, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
# bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://x.com/"
# bindd = SUPER SHIFT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# suspend system
bindd = SUPER SHIFT, X, Suspend, exec, systemctl suspend

unbind= , F11
unbind = , PRINT
unbind = SHIFT, PRINT
unbind = ALT, PRINT
unbind = SUPER, PRINT

bindd = , F11, Screenshot with editing, exec, omarchy-cmd-screenshot
bindd = SHIFT, F11, Screenshot to clipboard, exec, omarchy-cmd-screenshot smart clipboard
bindd = ALT, F11, Screenrecording, exec, omarchy-menu screenrecord
bindd = SUPER, F11, Color picker, exec, pkill hyprpicker || hyprpicker -a

unbind = SUPER, W
bindd = SUPER, W, Browser, exec, $browser --disable-features=WaylandWpColorManagerV1
bindd = SUPER, Q, Close active window, killactive,

unbind = SUPER, left
unbind = SUPER, right
unbind = SUPER, up
unbind = SUPER, down
unbind = SUPER SHIFT, left
unbind = SUPER SHIFT, right
unbind = SUPER SHIFT, up
unbind = SUPER SHIFT, down

unbind = SUPER, J
bindd = SUPER, U, Toggle split, togglesplit, # dwindle
unbind = SUPER, K
unbind = SUPER, L
bindd = SUPER, I, Show key bindings, exec, omarchy-menu-keybindings
bindd = SUPER, H, Move focus left, movefocus, l
bindd = SUPER, J, Move focus down, movefocus, d
bindd = SUPER, K, Move focus up, movefocus, u
bindd = SUPER, L, Move focus right, movefocus, r
bindd = SUPER SHIFT, H, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, J, Swap window down, swapwindow, d
bindd = SUPER SHIFT, K, Swap window up, swapwindow, u
bindd = SUPER SHIFT, L, Swap window to the right, swapwindow, r

bindd = SUPER ALT, H, Move window to group on left, moveintogroup, l
bindd = SUPER ALT, J, Move window to group on bottom, moveintogroup, d
bindd = SUPER ALT, K, Move window to group on top, moveintogroup, u
bindd = SUPER ALT, L, Move window to group on right, moveintogroup, r

unbind = SUPER, TAB
unbind = SUPER SHIFT, TAB
unbind = SUPER CTRL, TAB
bindd = SUPER, TAB, Former workspace, workspace, previous
bindd = SUPER SHIFT, TAB, Next workspace, workspace, e+1
bindd = SUPER CTRL, TAB, Previous workspace, workspace, e-1

unbind = SUPER, F
unbind  = SHIFT, F11,
unbind  = ALT, F11,
bindd = SUPER, F, Full width, fullscreen, 1
bindd = SUPER SHIFT, F, Force full screen, fullscreen, 0
bindd = SUPER SHIFT, COMMA, Move current workspace to the left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT, PERIOD, Move current workspace to the right monitor, movecurrentworkspacetomonitor, r
bindd = SUPER, 0, move to workspace 10, workspace, 10
bindd = SUPER SHIFT, 0, move to workspace 10, movetoworkspace, 10
